name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        description: What directory should the image be built from
        required: true
      image_name:
        type: string
        description: Name of Docker image
        required: true
      image_tag:
        type: string
        description: Tag for Docker image
        required: true
      push_image:
        type: boolean
        description: Should the image be pushed to the Github Container Registry
        required: false
        default: false
    secrets:
      GH_TOKEN:
        description: Github access token
        required: false
      SLACK_WEBHOOK_URL:
        description: Slack webhook URL to send messages to
        required: false
    outputs:
      image_name:
        description: Fully qualified image name
        value: ${{ jobs.build.outputs.image_name }}
      image_ref:
        description: Docker image reference
        value: ${{ jobs.build.outputs.image_ref }}

  workflow_dispatch:
    inputs:
      working_directory:
        type: string
        description: What directory should the image be built from
        required: true
      image_name:
        type: string
        description: Name of Docker image
        required: true
      image_tag:
        type: string
        description: Tag for Docker image
        required: true
      push_image:
        type: boolean
        description: Should the image be pushed to the Github Container Registry
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build image
    timeout-minutes: 30

    outputs:
      image_name: ${{ steps.env_var.outputs.image_name }}
      image_ref: ${{ steps.env_var.outputs.image_ref }}

    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache
        # https://github.com/orgs/community/discussions/25678#discussioncomment-5242449

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ohw-docker-buildx-${{ inputs.image_name }}-${{ github.sha }}
          restore-keys: |
            ohw-docker-buildx-${{ inputs.image_name }}

      - name: Set Job Environment Variables
        id: env_var
        run: |
          SHA7="${GITHUB_SHA::7}"
          DOCKER_TAG=$SHA7
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/${INPUTS_IMAGE_NAME}"
          echo "DOCKER_TAG=${INPUTS_IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          INPUTS_IMAGE_NAME: ${{ inputs.image_name }}
          INPUTS_IMAGE_TAG: ${{ inputs.image_tag }}

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          push: false
          load: true
          context: ${{ inputs.working_directory }}

      - name: Docker image sizes
        run: |
          docker images | grep "${IMAGE_NAME}"

          echo "### Image sizes" >> "$GITHUB_STEP_SUMMARY"
          docker images | grep "${IMAGE_NAME}" >> "$GITHUB_STEP_SUMMARY"

      - name: Export Full Conda Environment
        run: |
          docker run "${IMAGE_NAME}:${DOCKER_TAG}" conda list > conda-packages.txt

          echo "### Conda Environment" >> "$GITHUB_STEP_SUMMARY"
          cat conda-packages.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Archive Conda Package List
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conda-packages
          path: conda-packages.txt

      - name: Save Docker Image
        if: ${{ inputs.push_image }}
        run: docker save "${IMAGE_NAME}:${DOCKER_TAG}" | gzip > docker-image.tar.gz

      - name: Upload Docker Image Artifact
        if: ${{ inputs.push_image }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ inputs.image_name }}
          path: docker-image.tar.gz
          retention-days: 1

      - name: Move Docker Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    needs: build
    if: ${{ inputs.push_image }}
    runs-on: ubuntu-22.04
    name: Push image
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write # needed to push the built image to GHCR

    env:
      IMAGE_NAME: ${{ needs.build.outputs.image_name }}
      DOCKER_TAG: ${{ needs.build.outputs.image_ref }}

    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image-${{ inputs.image_name }}

      - name: Load Docker Image
        run: gunzip -c docker-image.tar.gz | docker load

      - name: "Log into GitHub Container Registery"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GitHub Container Registry
        run: docker push "${IMAGE_NAME}:${DOCKER_TAG}"

      - name: Tag Image with Latest
        run: docker tag "${IMAGE_NAME}:${DOCKER_TAG}" "${IMAGE_NAME}:latest"

      - name: Push Latest Tag to GitHub Container Registry
        run: docker push "${IMAGE_NAME}:latest"

      - name: Notify on newly built image
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "Built image ${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}. Maybe let 2i2c know?"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Built image `${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}`. Maybe let 2i2c know?"
