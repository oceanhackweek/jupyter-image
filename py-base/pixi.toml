nano = ">=9.2,<10"
gh-scoped-creds = ">=4.1,<5"
zarr = ">=3.3.0,<4"
netcdf4 = ">=1.7.4,<2"
s3fs = ">=2026.6.0,<2027"
ipykernel = ">=7.3.0,<8"
flox = ">=0.11.2,<0.12"
opt_einsum = ">=3.4.0,<4"
numbagg = ">=0.9.4,<0.10"
fsspec = ">=2026.6.0,<2027"
gcsfs = ">=2026.7.0,<2027"
