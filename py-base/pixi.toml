[workspace]
name = "OHW-py"
version = "0.1.0"
description = "Add a short description here"
authors = ["Alex Kerney <abk@mac.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "linux-aarch64"]
exclude-newer = "7d"

[tasks]
lab = "jupyter lab --port=8080 --ip=0.0.0.0"

[environments]
default = {features = [
    "ai",
    "26-data-access",
    "26-xarray",
    "26-icechunk",
    "26-ocean-data",
    # "25-boris-llm",
    "marimo",
    "streamlit",
    # "ohw25_proj_RiptideRemix",
    # "earthmover-demo"
    # "24-Jiarui", "24-Ciara", "24-Myranda"
    ]}

# The workspace-wide 7d cooldown would reject marimo 0.24.0 (released 2026-08-17), and
# marimo-jupyter-extension is pinned tightly to marimo. Exempt just these two rather
# than shifting the cutoff for every other dependency. Root-level table only; pixi has
# no per-feature equivalent.
[pypi-exclude-newer]
marimo = "0d"
marimo-jupyter-extension = "0d"


[dependencies]
python = ">=3.13.14,<3.15"
pangeo-notebook = ">=2026.6.3,<2027"
pixi-kernel = ">=0.7.1,<0.8"
pooch = ">=1.9.0,<2"
curl = ">=8.21.0,<9"
git = ">=2.55.0,<3"
wget = ">=1.25.0,<2"
tar = ">=1.35,<2"
vim = ">=9.2.785,<10"
