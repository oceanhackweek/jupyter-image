[feature.marimo.pypi-dependencies]
marimo = ">=0.24,<0.25"
marimo-jupyter-extension = ">=0.3.0, <0.4"

# marimo >=0.23.5 requires jedi<0.20.0. Without this the conda solve pins jedi 0.20.0
# on linux-aarch64 and marimo silently resolves back to 0.23.4, below the version
# marimo-jupyter-extension targets. Constrains jedi without depending on it directly.
[feature.marimo.constraints]
jedi = "<0.20"

# Served through jupyter-server-proxy, which pangeo-notebook already pulls in. The
# proxied `/streamlit/` route is registered in jupyter_server_config.py; participants
# serve their own apps over /proxy/absolute/<port>/ instead.
#
# From PyPI rather than conda-forge: streamlit needs pydeck, and conda-forge's pydeck
# carries an `ipywidgets >=7,<8` run constraint that no version of streamlit >=1.61 can
# satisfy alongside the ipywidgets 8 the tutorials pull in. PyPI's pydeck keeps
# ipywidgets as an optional extra, so the conflict disappears; the rest of streamlit's
# runtime deps resolve against the conda packages already in the environment.
[feature.streamlit.pypi-dependencies]
streamlit = ">=1.61.1,<2"

